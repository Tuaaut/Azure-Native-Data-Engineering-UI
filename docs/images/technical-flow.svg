<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Azure-native data engineering technical architecture</title>
  <desc id="desc">Technical flow from machine API JSON through Azure Data Factory, ADLS Gen2 Raw, Synapse Serverless SQL, Bronze Silver and Gold Parquet, the Gold view, Power BI semantic model, and Power BI report, with email-only Function and ADF failure observability.</desc>

